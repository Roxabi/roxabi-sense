[project]
name = "roxabi-sense"
version = "0.0.1"
description = "Workstation attention journal — local sensors, CLI, MCP, optional NATS"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.13"
authors = [{ name = "Roxabi" }]
keywords = ["activity", "focus", "mcp", "local-first", "roxabi"]
dependencies = []

[project.optional-dependencies]
nats = [
    # pin when wiring factory.event.host.*
    # "nats-py>=2.9.0",
]
mcp = [
    # pin MCP SDK when implementing sense mcp
    "mcp>=1.9",
]

[project.scripts]
sense = "roxabi_sense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roxabi_sense"]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.16.1",
    "mcp>=1.9",  # test MCP surface registration
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

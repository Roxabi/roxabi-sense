[project]
name = "roxabi-sense"
version = "0.0.1"
description = "Workstation attention journal — local sensors, CLI, MCP, optional NATS"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.13"
authors = [{ name = "Roxabi" }]
keywords = ["activity", "focus", "mcp", "local-first", "roxabi"]
dependencies = []

[project.optional-dependencies]
nats = [
    # pin when wiring factory.event.host.*
    # "nats-py>=2.9.0",
]
mcp = [
    # pin MCP SDK when implementing sense mcp
    "mcp>=1.9",
]

[project.scripts]
sense = "roxabi_sense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roxabi_sense"]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.16.3",
    "mcp>=1.9",  # test MCP surface registration
]

[tool.ruff]
line-length = 100
target-version = "py313"
# tools/ holds gate scripts vendored verbatim from roxabi-plugins/plugins/dev-core/tools.
# Formatting them here rewrites upstream bytes and recreates the drift ssot-verify V18
# reports, so the copy is excluded rather than reformatted.
extend-exclude = ["tools/"]
# Explicit paths bypass exclude unless force-exclude is set; the pre-commit hook
# passes staged filenames explicitly, so without this the exclusion is inert there.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

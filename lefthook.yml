# Local fast-feedback hooks. Run `lefthook install` once per clone — the
# machine-global core.hooksPath that used to dispatch these was retired
# 2026-08-02, so without it git has no hook to run at all.
pre-commit:
  commands:
    lint:
      run: uv run ruff check .
    typecheck:
      run: uv run pyright
    check-file-length:
      run: tools/check_file_length.sh
    check-folder-size:
      run: tools/check_folder_size.sh

pre-push:
  commands:
    trufflehog:
      run: trufflehog git file://. --only-verified --fail
    license:
      run: uv run tools/license_check.py
    tests:
      run: uv run pytest
